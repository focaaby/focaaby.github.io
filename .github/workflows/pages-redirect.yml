name: Deploy focaaby.github.io redirect (GitHub Pages)

# focaaby.github.io only serves redirect pages to https://focaaby.com/.
# The real site is deployed to S3 + CloudFront by deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - "pages-redirect/**"
      - ".github/workflows/pages-redirect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
