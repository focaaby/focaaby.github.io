name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0
  AWS_REGION: ap-northeast-1
  S3_BUCKET: ${{ secrets.S3_BUCKET }}                                   # repo secret (masked in logs)
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}  # repo secret (masked in logs)
  AWS_ROLE_ARN: arn:aws:iam::437269060125:role/focaaby-blog-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: Build
        run: hugo --gc --minify

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # resume.pdf is uploaded to S3 manually (not tracked in git), keep it out of --delete
      - name: Sync to S3
        run: aws s3 sync public/ "s3://${S3_BUCKET}/" --delete --no-progress --exclude "resume.pdf"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          echo "Invalidation: ${id}"
