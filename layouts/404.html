{{ define "body_class" }}error-template{{ end }}
{{ define "main" }}
<section class="outer error-content">
    <div class="inner">
        <section class="error-message">
            <h1 class="error-code">404</h1>
            <p class="error-description">Page not found</p>
            <a class="error-link" href="/">Go to the front page →</a>
        </section>
    </div>
</section>

<aside class="read-more-wrap">
    <div class="read-more inner">
        {{ range first 3 (where site.RegularPages "Section" "posts") }}
            {{ partial "post-card.html" (dict "page" . "large" false) }}
        {{ end }}
    </div>
</aside>
{{ end }}
